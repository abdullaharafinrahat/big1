<!DOCTYPE html>

<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bondhu - Login</title>

<link href="../css/base.css" rel="stylesheet"/><link href="../css/components.css" rel="stylesheet"/><link href="../css/pages/login.css" rel="stylesheet"/><link href="../css/layout.css" rel="stylesheet"/></head>
<body><div id="app-header"></div>
<main class="login-page">
<section class="login-card">
<header class="login-header">
<a aria-label="Bondhu home" class="logo-link" href="../index.html">
<img alt="Bondhu logo" class="logo-icon" src="../assets/images/service-icons/blood-drop.png"/>
</a>
<h1>Bondhu</h1>
<p>এক প্ল্যাটফর্ম, সকল সেবা</p>
</header>
<div aria-hidden="true" class="drop-divider">
<span></span>
<img alt="" src="../assets/images/service-icons/blood-drop.png"/>
<span></span>
</div>
<section class="welcome-text">
<h2>স্বাগতম ফিরে আসার জন্য</h2>
<p>আপনার অ্যাকাউন্ট লগইন করুন</p>
</section>
<form class="login-form" id="login-form">
<label>
<span>ইউজার আইডি / মোবাইল নম্বর</span>
<div class="input-wrap">
<img alt="" aria-hidden="true" src="../assets/images/service-icons/person-search.png"/>
<input autocomplete="username" name="identifier" placeholder="ইউজার আইডি অথবা মোবাইল নম্বর লিখুন" required="" type="text"/>
</div>
</label>
<label>
<span>পাসওয়ার্ড</span>
<div class="input-wrap password-wrap">
<img alt="" aria-hidden="true" src="../assets/images/service-icons/emergency-siren.png"/>
<input autocomplete="current-password" id="password" name="password" placeholder="পাসওয়ার্ড লিখুন" required="" type="password"/>
<button aria-label="Show password" id="toggle-password" type="button">দেখুন</button>
</div>
</label>
<label class="remember-row">
<input id="remember-me" name="remember" type="checkbox"/>
<span>আমাকে মনে রাখুন</span>
</label>
<button class="submit-btn" type="submit">
<img alt="" aria-hidden="true" src="../assets/images/service-icons/emergency-call.png"/>
<span>লগইন করুন</span>
</button>
</form>
<div class="or-divider">
<span></span>
<b>অথবা</b>
<span></span>
</div>
<div class="forgot-wrap">
<a class="forgot-link" href="forgot-password.html">
<img alt="" aria-hidden="true" src="../assets/images/service-icons/emergency-siren.png"/>
<span>পাসওয়ার্ড ভুলে গেছেন?</span>
</a>
</div>
<div class="register-prompt">
<span>অ্যাকাউন্ট নেই?</span>
<a href="register.html">এখনই রেজিস্টার করুন</a>
</div>
<section class="support-banner">
<div class="security-copy">
<img alt="Security" src="../assets/images/service-icons/award-star.png"/>
<span>আপনার তথ্য নিরাপদ এবং গোপন রাখা হবে।</span>
</div>
<div class="banner-divider"></div>
<div class="support-copy">
<img alt="Support" src="../assets/images/service-icons/emergency-call.png"/>
<span><small>সহায়তার জন্য কল করুন</small><strong>09609-123456</strong></span>
</div>
</section>
<nav aria-label="Quick links" class="login-nav-links">
<a href="../index.html">Home</a>
<a href="request-blood.html">Blood</a>
<a href="hospitals.html">Hospitals</a>
<a href="ambulance.html">Ambulance</a>
<a href="news.html">News</a>
</nav>
<p class="copyright">© 2026 Bondhu. সকল অধিকার সংরক্ষিত।</p>
</section>
</main><div id="app-footer"></div>
<div aria-live="polite" class="login-toast-region" id="toast-region"></div>
<script src="../js/main.js" type="module"></script><script src="../js/pages/login.page.js"></script>
</body>
</html>
