services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: bondhu, POSTGRES_USER: bondhu, POSTGRES_PASSWORD: bondhu}
    ports: ['5432:5432']
  redis: {image: redis:7-alpine, ports: ['6379:6379']}
  rabbitmq: {image: rabbitmq:3-management-alpine, ports: ['5672:5672','15672:15672']}
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment: ['discovery.type=single-node','xpack.security.enabled=false']
    ports: ['9200:9200']
  backend:
    build: ../backend
    env_file: ../backend/.env.example
    ports: ['4000:4000']
    depends_on: [postgres, redis, rabbitmq]
  frontend:
    image: nginx:alpine
    volumes: ['../frontend:/usr/share/nginx/html:ro','./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['8080:80']
    depends_on: [backend]
